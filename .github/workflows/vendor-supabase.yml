name: Vendor Supabase JS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-supabase.yml'

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download supabase-js UMD bundle
        run: |
          mkdir -p js/vendor
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" \
            -o js/vendor/supabase.min.js

      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/vendor/supabase.min.js
          git diff --cached --quiet || git commit -m "chore: update vendored supabase-js bundle"
          git push
