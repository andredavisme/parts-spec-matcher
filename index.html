<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parts Spec Matcher</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="view-login" class="view active">
    <div class="card">
      <h1>Parts Spec Matcher</h1>
      <p class="subtitle">Sign in to continue</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required />
        </div>
        <p id="login-error" class="error-msg hidden"></p>
        <button type="submit" id="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- PRODUCT TYPE SELECTOR VIEW -->
  <div id="view-selector" class="view hidden">
    <header class="app-header">
      <span class="app-title">Parts Spec Matcher</span>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn-secondary">Sign Out</button>
      </div>
    </header>
    <main class="selector-main">
      <h2>New Quote Request</h2>
      <p class="hint">Select a product type to generate a specification requirements form.</p>
      <div class="field">
        <label for="category-select">Product Category</label>
        <select id="category-select">
          <option value="">&mdash; Select a category &mdash;</option>
        </select>
      </div>
      <div class="field" id="product-type-field" style="display:none">
        <label for="product-type-select">Product Type</label>
        <select id="product-type-select">
          <option value="">&mdash; Select a product type &mdash;</option>
        </select>
      </div>
      <p id="selector-error" class="error-msg hidden"></p>
      <button id="start-request-btn" class="btn-primary" disabled>Start Request &rarr;</button>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/selector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
